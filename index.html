<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Chronicle · 2D 试玩</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','PingFang SC',monospace;user-select:none}
body{background:#0a0c10;width:100vw;height:100dvh;overflow:hidden;display:flex;justify-content:center;align-items:center}
#app{width:100vw;height:56.25vw;max-height:100dvh;max-width:177.78vh;background:#14181f;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.9);padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
@media(min-aspect-ratio:16/9){#app{width:177.78vh;height:100vh}}
@media(max-aspect-ratio:16/9){#app{width:100vw;height:56.25vw}}
.page{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;transition:opacity .8s,transform .8s;opacity:0;pointer-events:none;transform:scale(1.02)}
.page.active{opacity:1;pointer-events:auto;transform:scale(1)}
#loginPage{background:radial-gradient(ellipse at 30% 40%,#1f2a32,#0a0c10 80%);flex-direction:column;gap:28px;position:relative;overflow:hidden}
.scene-decor{position:absolute;width:100%;height:100%;pointer-events:none}
.tree{position:absolute;bottom:10%;left:8%;width:120px;height:200px;background:#1c1f1a;clip-path:polygon(40% 0%,60% 0%,70% 40%,90% 30%,80% 60%,100% 70%,70% 80%,60% 100%,40% 100%,30% 80%,0% 70%,20% 60%,10% 30%,30% 40%);transform:rotate(10deg);opacity:.5}
.tree2{left:auto;right:12%;bottom:5%;transform:rotate(-20deg) scale(.7);opacity:.3}
.fire{position:absolute;bottom:8%;left:45%;width:60px;height:80px;background:radial-gradient(ellipse at 50% 100%,#ff7a2f,#d4380d 30%,transparent 70%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;filter:blur(4px) drop-shadow(0 0 30px #f40);animation:flicker 1.2s infinite alternate ease-in-out}
.fire::after{content:'';position:absolute;top:-20px;left:10px;width:40px;height:60px;background:radial-gradient(ellipse,#ffb347,transparent 70%);filter:blur(10px);animation:flicker .9s infinite alternate-reverse}
@keyframes flicker{0%{transform:scale(1) rotate(-2deg);opacity:.9}100%{transform:scale(1.1) rotate(3deg);opacity:1}}
.login-title{font-size:56px;font-weight:200;letter-spacing:18px;background:linear-gradient(180deg,#f0f4ff,#7a8ba5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'Courier New',monospace;z-index:10;text-shadow:0 0 60px rgba(0,80,200,.1)}
.login-sub{font-size:13px;letter-spacing:6px;color:#4f637d;z-index:10;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.03);padding-top:14px}
.btn-login{z-index:10;padding:14px 56px;background:rgba(20,40,70,.5);border:1px solid rgba(100,180,255,.15);color:#b8d0f0;font-size:17px;letter-spacing:4px;cursor:pointer;transition:.25s;backdrop-filter:blur(8px);border-radius:4px;text-transform:uppercase;margin-top:10px}
.btn-login:hover{background:rgba(40,100,200,.25);border-color:#6af;box-shadow:0 0 40px rgba(50,150,255,.12);transform:scale(1.02)}
#transitionPage{background:#030507;flex-direction:column;gap:20px}
#transitionCanvas{width:100%;height:100%;display:block;position:absolute}
.transition-text{position:relative;z-index:20;color:#8aa4d0;font-size:14px;letter-spacing:8px;text-transform:uppercase;animation:pulseText 1.5s infinite alternate;background:rgba(0,0,0,.5);padding:8px 24px;border-left:2px solid #2a6f9c}
@keyframes pulseText{0%{opacity:.4;letter-spacing:4px}100%{opacity:1;letter-spacing:12px}}
#gamePage{background:#11161d;padding:0;overflow:hidden}
#gameCanvas{width:100%;height:100%;display:block;background:#1e2a2e;cursor:default}

/* ---------- 通用UI组件 ---------- */
.hud-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;pointer-events:none;opacity:0;transition:opacity .3s;display:flex;justify-content:flex-start;align-items:center}
.hud-overlay.visible{opacity:1;pointer-events:auto}
.hud-backdrop{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hud-panel{position:relative;z-index:2;width:40%;max-width:420px;height:100%;background:rgba(10,18,30,0.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid rgba(100,200,255,0.12);padding:24px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:8px 0 40px rgba(0,0,0,.6);transform:translateX(-100%);transition:transform .35s cubic-bezier(.23,1,.32,1)}
.hud-overlay.visible .hud-panel{transform:translateX(0)}
.hud-panel::-webkit-scrollbar{width:3px}
.hud-panel::-webkit-scrollbar-thumb{background:#2a4a6a;border-radius:10px}
.hud-title{font-size:14px;letter-spacing:4px;color:#7ab8d0;text-transform:uppercase;border-bottom:1px solid rgba(100,200,255,0.1);padding-bottom:12px}
.char-row{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.25);padding:12px 16px;border-radius:10px;border:1px solid rgba(100,200,255,0.06)}
.char-name{font-size:18px;font-weight:400;color:#eef4ff;letter-spacing:1px}
.trait-badge{font-size:12px;color:#7ab8d0;background:rgba(0,40,80,.3);padding:3px 16px;border-radius:40px;border:1px solid rgba(100,180,255,.06);display:inline-block;width:fit-content}
.trait-badge.locked{color:#4a5d78;border-color:rgba(255,255,255,.04)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:rgba(0,0,0,.15);padding:12px;border-radius:10px;border:1px solid rgba(100,200,255,0.06)}
.stat-card{display:flex;flex-direction:column;align-items:center}
.stat-card .label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#5a7a9a}
.stat-card .value{font-size:22px;font-weight:300;color:#d0e0ff;font-variant-numeric:tabular-nums;transition:all .3s}
.stat-card .value.blurred{filter:blur(8px);color:#4a5d78;user-select:none}
.stat-card .value.reveal{animation:dataReveal .6s cubic-bezier(.23,1,.32,1)}
@keyframes dataReveal{0%{filter:blur(12px) brightness(.3);transform:translateY(8px);opacity:0}60%{filter:blur(0) brightness(1.5);transform:translateY(-4px)}100%{filter:blur(0) brightness(1);transform:translateY(0);opacity:1}}
.action-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.15);padding:8px 12px;border-radius:10px;border:1px solid rgba(100,200,255,0.06)}

/* 按钮通用样式 */
.btn-eye,.btn-trade,.btn-chronicle,.btn-save,.btn-back,.btn-login,.btn-yes,.btn-no,.btn-pay-confirm,.btn-pay-cancel,.close-btn{background:rgba(20,40,70,0.4);border:1px solid rgba(100,200,255,0.15);color:#c8d8e8;padding:6px 18px;border-radius:40px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);flex-shrink:0;line-height:1.4}
.btn-eye:hover,.btn-trade:hover,.btn-chronicle:hover,.btn-save:hover,.btn-back:hover,.btn-login:hover,.btn-yes:hover,.btn-no:hover,.btn-pay-confirm:hover,.btn-pay-cancel:hover,.close-btn:hover{background:rgba(40,100,200,0.25);border-color:#6af;box-shadow:0 0 30px rgba(50,150,255,0.15);transform:scale(1.02)}
.btn-eye.paid{color:#6a8a7a;border-color:rgba(100,200,180,.3);cursor:default;opacity:.6}
.btn-eye.paid:hover{background:rgba(20,40,70,0.4);box-shadow:none;transform:scale(1)}
.btn-back{border-color:#5a3a3a;color:#b07a7a}
.btn-back:hover{border-color:#8a5a5a;color:#d09a9a;background:rgba(80,40,40,0.3)}
.hud-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.03);padding-top:12px;margin-top:4px}
.esc-hint{font-size:11px;color:#3a5a6a;letter-spacing:1px}

/* 浮动消息 */
#floatMessage{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:25;background:rgba(10,18,30,0.75);backdrop-filter:blur(8px);padding:6px 20px;border-radius:30px;border:1px solid rgba(100,200,255,0.1);color:#e8f0ff;font-size:15px;letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;transform:translateX(-50%) translateY(-8px);white-space:nowrap;box-shadow:0 4px 30px rgba(0,0,0,.5)}
#floatMessage.show{opacity:1;transform:translateX(-50%) translateY(0)}
#floatMessage.success{border-color:rgba(60,200,255,.3);color:#a0d8ff}
#floatMessage.fail{border-color:rgba(200,80,80,.3);color:#e0a0a0}
#floatMessage.system{border-color:rgba(200,180,80,.2);color:#d0c8a0}
#floatMessage.milestone{border-color:rgba(255,180,60,.4);color:#f5c842}

/* 交易行 */
#tradeOverlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
#tradeOverlay.visible{opacity:1;pointer-events:auto}
.trade-panel{background:rgba(10,18,30,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(100,200,255,0.12);border-radius:16px;padding:32px 36px;max-width:500px;width:80%;max-height:70vh;overflow-y:auto;box-shadow:0 20px 80px rgba(0,0,0,.8);color:#e0ecf8}
.trade-panel h2{font-size:22px;font-weight:300;letter-spacing:4px;border-bottom:1px solid rgba(100,200,255,0.1);padding-bottom:16px;margin-bottom:16px;color:#7ab8d0}
.trade-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:14px}
.trade-item .name{color:#c8d8e8}
.trade-item .price{color:#f5c542}
.trade-close-hint{margin-top:20px;text-align:center;color:#3d5a78;font-size:12px;letter-spacing:1px}
.trade-notice{text-align:center;padding:20px 0}
.trade-notice .icon{font-size:48px;margin-bottom:12px}
.trade-notice .msg{font-size:16px;color:#b0c8e0}
.trade-notice .sub{font-size:13px;color:#5a7a8a;margin-top:8px}
.trade-notice .btn-close-notice{margin-top:20px;background:#1a3a5a;border:none;color:#fff;padding:8px 32px;border-radius:40px;cursor:pointer;font-size:14px}

/* 解锁动画 */
.unlock-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:30;background:rgba(0,20,60,.6);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.unlock-overlay.active{opacity:1;pointer-events:auto}
.unlock-overlay .scan-line{width:80%;height:3px;background:linear-gradient(90deg,transparent,#4af,#8cf,#4af,transparent);box-shadow:0 0 60px #2a7aff;animation:scanMove 1.2s cubic-bezier(.65,0,.35,1) forwards}
@keyframes scanMove{0%{transform:translateY(-400px) scaleX(.2);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(400px) scaleX(1.2);opacity:0}}

/* 对话框 */
#dialogOverlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:60;background:rgba(0,0,0,.75)}
#dialogOverlay .dialog-bg{width:100%;height:100%;background-image:url('assets/img/background/iron.png');background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
#dialogOverlay .dialog-shade{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4)}
#dialogOverlay .dialog-content{position:relative;z-index:2;background:rgba(10,18,30,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:30px 40px;min-height:45%;border-top:1px solid rgba(255,255,255,0.08);border-radius:0 0 12px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center}
#dialogOverlay .dialog-title{font-size:28px;color:#ffd700;font-weight:300;letter-spacing:4px;margin-bottom:10px}
#dialogOverlay .dialog-question{margin-bottom:30px;text-align:center;color:#e8f0ff;font-size:20px}
#dialogOverlay .dialog-buttons{display:flex;gap:50px;margin-top:10px}
#dialogOverlay .dialog-buttons button{padding:14px 50px;font-size:20px;font-weight:500;border-radius:12px;cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.1)}
#dialogOverlay .dialog-buttons .btn-yes{background:linear-gradient(135deg,#2a5a8a,#1a3a6a);color:#fff;border-color:rgba(100,180,255,.3)}
#dialogOverlay .dialog-buttons .btn-yes:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(40,120,255,.3)}
#dialogOverlay .dialog-buttons .btn-no{background:linear-gradient(135deg,#5a4a3a,#3a2a1a);color:#d0c8b0;border-color:rgba(200,180,160,.2)}
#dialogOverlay .dialog-buttons .btn-no:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(200,180,160,.2)}
#dialogOverlay .dialog-hint{margin-top:20px;font-size:13px;color:#4d6a8a;letter-spacing:2px}

/* 付费对话框 */
#payDialogOverlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:65;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);justify-content:center;align-items:center}
#payDialogOverlay .pay-dialog-box{background:rgba(10,18,30,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:40px 50px;max-width:420px;width:80%;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.8)}
#payDialogOverlay .pay-dialog-box .icon{font-size:48px;margin-bottom:12px;color:#ffffff}
#payDialogOverlay .pay-dialog-box .title{font-size:24px;color:#e8f0ff;font-weight:300;letter-spacing:2px;margin-bottom:8px}
#payDialogOverlay .pay-dialog-box .price{font-size:32px;color:#ffd700;font-weight:500;margin-bottom:24px}
#payDialogOverlay .pay-dialog-box .buttons{display:flex;gap:20px;justify-content:center}
#payDialogOverlay .pay-dialog-box .buttons button{padding:12px 32px;font-size:18px;font-weight:500;border-radius:40px;cursor:pointer;transition:.2s;border:2px solid rgba(255,255,255,.1);box-shadow:0 4px 20px rgba(0,0,0,.4)}
#payDialogOverlay .pay-dialog-box .buttons .btn-pay-confirm{background:linear-gradient(135deg,#2a5a8a,#1a3a6a);color:#fff;border-color:rgba(100,180,255,.3)}
#payDialogOverlay .pay-dialog-box .buttons .btn-pay-confirm:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(40,120,255,.3)}
#payDialogOverlay .pay-dialog-box .buttons .btn-pay-cancel{background:linear-gradient(135deg,#5a4a3a,#3a2a1a);color:#d0c8b0;border-color:rgba(200,180,160,.2)}
#payDialogOverlay .pay-dialog-box .buttons .btn-pay-cancel:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(200,180,160,.2)}

/* 编年史 */
#chronicleOverlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:70;background:rgba(0,0,0,.92);backdrop-filter:blur(8px)}
#chronicleOverlay .chronicle-container{width:100%;height:100%;padding:60px 80px;display:flex;flex-direction:column;overflow-y:auto;background:rgba(10,18,30,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#chronicleOverlay .chronicle-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(100,200,255,0.08);padding-bottom:20px;margin-bottom:30px}
#chronicleOverlay .chronicle-header .title{font-size:32px;font-weight:200;letter-spacing:8px;color:#7ab8d0}
#chronicleOverlay .chronicle-header .close-btn{background:transparent;border:1px solid rgba(255,255,255,.1);color:#5a7a8a;padding:8px 24px;border-radius:30px;cursor:pointer;font-size:14px;letter-spacing:2px}
#chronicleOverlay .chronicle-header .close-btn:hover{border-color:rgba(255,255,255,.3);color:#aac0d0}
#chronicleOverlay .chronicle-list{flex:1;display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding-right:20px}
#chronicleOverlay .chronicle-list::-webkit-scrollbar{width:4px}
#chronicleOverlay .chronicle-list::-webkit-scrollbar-thumb{background:#2a4a6a;border-radius:10px}
#chronicleOverlay .chronicle-footer{margin-top:30px;font-size:13px;color:#3d5a78;letter-spacing:2px;border-top:1px solid rgba(100,200,255,0.06);padding-top:20px;text-align:center}

/* 成就 */
#achievementOverlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:80;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);justify-content:center;align-items:center;cursor:pointer}
#achievementOverlay .achievement-box{background:rgba(10,18,30,0.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:2px solid rgba(255,255,255,0.2);border-radius:24px;padding:50px 60px;max-width:600px;width:80%;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.8);animation:achievementPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes achievementPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#achievementOverlay .achievement-box .icon{font-size:64px;margin-bottom:10px}
#achievementOverlay .achievement-box .title{font-size:36px;font-weight:300;color:#ffd700;letter-spacing:4px;margin-bottom:10px}
#achievementOverlay .achievement-box .desc{font-size:20px;color:#e8f0ff;letter-spacing:2px;margin-bottom:20px}
#achievementOverlay .achievement-box .hint{font-size:14px;color:#5a7a8a;letter-spacing:2px;border-top:1px solid rgba(255,255,255,.05);padding-top:20px}

/* 视频、音效、摇杆 */
#achievementVideo{position:absolute;top:0;left:0;width:100%;height:100%;z-index:45;display:none;object-fit:contain;background:#000}
#achievementSound{display:none}
#joystickZone{position:absolute;bottom:40px;left:24px;width:120px;height:120px;z-index:10;pointer-events:auto;touch-action:none}
#joystickBase{width:120px;height:120px;border-radius:50%;background:rgba(30,50,80,.45);backdrop-filter:blur(8px);border:2px solid rgba(100,180,255,.08);position:relative;box-shadow:0 0 40px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.3);transition:border-color .2s}
#joystickBase.active{border-color:rgba(100,200,255,.25)}
#joystickKnob{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6a9ac0,#1a3a5a);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 30px rgba(40,120,255,.15),inset 0 -4px 8px rgba(0,0,0,.4);border:1px solid rgba(150,210,255,.15);transition:box-shadow .2s;pointer-events:none}
#joystickKnob.pressed{box-shadow:0 0 50px rgba(60,180,255,.25),inset 0 -4px 8px rgba(0,0,0,.4)}
#joystickBase::after{content:'';position:absolute;top:50%;left:50%;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(100,180,255,.04);pointer-events:none}

/* 菜单按钮 */
#menuButton{position:absolute;top:16px;left:16px;z-index:15;cursor:pointer;opacity:.6;transition:opacity .2s,transform .2s;background:rgba(0,0,0,.35);border-radius:50%;width:44px;height:44px;display:flex;justify-content:center;align-items:center;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(4px);box-shadow:0 0 20px rgba(0,0,0,.4);pointer-events:auto}
#menuButton:hover{opacity:.9;transform:scale(1.05);border-color:rgba(255,255,255,.2)}
#menuButton .gear-icon{font-size:22px;line-height:1;filter:drop-shadow(0 0 6px rgba(0,0,0,.6));color:#d0e4f8;transition:transform .6s ease}
#menuButton:hover .gear-icon{transform:rotate(60deg)}
#menuButton .esc-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;background:rgba(0,0,0,.4);padding:0 8px;border-radius:10px;white-space:nowrap;backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.04)}

/* 响应式 */
@media (max-width:700px){
#menuButton{width:36px;height:36px;top:12px;left:12px}
#menuButton .gear-icon{font-size:18px}
#menuButton .esc-label{font-size:8px;bottom:-18px}
#joystickZone{width:90px;height:90px;bottom:30px;left:16px}
#joystickBase{width:90px;height:90px}
#joystickKnob{width:36px;height:36px}
.hud-panel{width:60%;padding:18px 16px}
.stats-grid{grid-template-columns:1fr 1fr}
.trade-panel{padding:24px 20px;width:90%}
#dialogOverlay .dialog-content{padding:20px;min-height:50%}
#dialogOverlay .dialog-title{font-size:22px}
#dialogOverlay .dialog-question{font-size:17px}
#dialogOverlay .dialog-buttons{gap:20px}
#dialogOverlay .dialog-buttons button{padding:10px 30px;font-size:17px}
#chronicleOverlay .chronicle-container{padding:30px 30px}
#chronicleOverlay .chronicle-header .title{font-size:24px}
#payDialogOverlay .pay-dialog-box{padding:30px 25px}
#payDialogOverlay .pay-dialog-box .title{font-size:20px}
#payDialogOverlay .pay-dialog-box .price{font-size:28px}
#achievementOverlay .achievement-box{padding:30px 30px}
#achievementOverlay .achievement-box .title{font-size:28px}
#achievementOverlay .achievement-box .desc{font-size:17px}
}
@media (max-width:480px){
.hud-panel{width:80%;padding:14px 12px}
.stats-grid{grid-template-columns:1fr 1fr;gap:4px}

function isGrass(wx, wy) {
    const col = Math.floor(wx / TILE_SIZE);

    // 必须与 drawScene 中的噪声计算完全一致
    const v1 = Math.sin(row * 0.04 + col * 0.035) * Math.cos(row * 0.03 - col * 0.04);

function generateTrees() {
    trees = [];
    const sx = WORLD_W / 2, sy = WORLD_H / 2;
    const minDistToCenter = SPAWN_RADIUS;
    const minDistToBuilding = 80;

    // 建筑障碍物
    const obstacles = [];
    for (const b of BUILDINGS) {
        obstacles.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, radius: minDistToBuilding });
    }

    
// 注意：右下白色方块 (24,48) 到 (48,96) 完全没有被引用，安全排除
    const PATH_THRESHOLD = 0.5;  // 与绘制中的值保持一致

    let attempts = 0;
    const maxAttempts = 500;
    let placed = 0;

    while (placed < 65 && attempts < maxAttempts) {
        attempts++;
        let x = 60 + Math.random() * (WORLD_W - 120);
        let y = 60 + Math.random() * (WORLD_H - 120);

        // 避开中央
        if (Math.sqrt((x - sx) ** 2 + (y - sy) ** 2) < minDistToCenter) continue;

        // 避开建筑
        let overlap = false;
        for (const obs of obstacles) {
            const dx = x - obs.x;
            const dy = y - obs.y;
            if (Math.sqrt(dx * dx + dy * dy) < obs.radius) {
                overlap = true;
                break;
            }
        }
        if (overlap) continue;

        // ---- 🌟 判断是否在黄土上（内嵌计算） ----
        const treeCol = Math.floor(x / TILE_SIZE);
        const treeRow = Math.floor(y / TILE_SIZE);
        const v1 = Math.sin(treeRow * 0.04 + treeCol * 0.035) * Math.cos(treeRow * 0.03 - treeCol * 0.04);
        const v2 = Math.sin(treeRow * 0.09 + treeCol * 0.08) * Math.cos(treeRow * 0.07 - treeCol * 0.06);
        const v3 = Math.sin(treeRow * 0.15 + treeCol * 0.12) * Math.cos(treeRow * 0.13 - treeCol * 0.14);
        let val = v1 * 1.0 + v2 * 0.6 + v3 * 0.3;
        val += 0.2 * Math.sin(treeRow * 0.011 + treeCol * 0.023);
        val += 0.2 * Math.cos(treeRow * 0.019 - treeCol * 0.017);
        if (val > PATH_THRESHOLD) continue;  // 跳过黄土

        // 放置树
        trees.push({ x, y, w: 64, h: 64, r: 10 });
        placed++;
    }

    // 补充树木到至少 50 棵
    while (trees.length < 50) {
        let x = 60 + Math.random() * (WORLD_W - 120);
        let y = 60 + Math.random() * (WORLD_H - 120);
        let overlap = false;
        for (const obs of obstacles) {
            const dx = x - obs.x;
            const dy = y - obs.y;
            if (Math.sqrt(dx * dx + dy * dy) < obs.radius) {
                overlap = true;
                break;
            }
        }
        if (overlap) continue;

        const treeCol = Math.floor(x / TILE_SIZE);
        const treeRow = Math.floor(y / TILE_SIZE);
        const v1 = Math.sin(treeRow * 0.04 + treeCol * 0.035) * Math.cos(treeRow * 0.03 - treeCol * 0.04);
        const v2 = Math.sin(treeRow * 0.09 + treeCol * 0.08) * Math.cos(treeRow * 0.07 - treeCol * 0.06);
        const v3 = Math.sin(treeRow * 0.15 + treeCol * 0.12) * Math.cos(treeRow * 0.13 - treeCol * 0.14);
        let val = v1 * 1.0 + v2 * 0.6 + v3 * 0.3;
        val += 0.2 * Math.sin(treeRow * 0.011 + treeCol * 0.023);
        val += 0.2 * Math.cos(treeRow * 0.019 - treeCol * 0.017);
        if (val > PATH_THRESHOLD) continue;

        trees.push({ x, y, w: 64, h: 64, r: 10 });
    }
}
function generateExtraTerrain() {

     // ---- 新增：出生点避让 ----

        return dx * dx + dy * dy < spawnRadius * spawnRadius;
    }

    const fixedObstacles = [];

        fixedObstacles.push({ x: b.x, y: b.y, w: b.w, h: b.h });

        fixedObstacles.push({ x: t.x - t.r, y: t.y - t.r, w: t.r * 2, h: t.r * 2 });
    }

    // ---- 辅助函数 ----
    function isBlocked(x, y, w, h, obstacles) {
        for (const obs of obstacles) {
            if (x < obs.x + obs.w && x + w > obs.x &&
                y < obs.y + obs.h && y + h > obs.y) {
                return true;
            }
        }
        return false;
    }

    function isAllGrass(x, y, w, h) {
        const pts = [
            [x + w/2, y + h/2],
            [x + 2, y + 2],
            [x + w - 2, y + 2],
            [x + 2, y + h - 2],
            [x + w - 2, y + h - 2]
        ];
        for (const [px, py] of pts) {
            if (!isGrass(px, py)) return false;
        }
        return true;
    }

            const row = Math.floor(Math.random() * (WORLD_ROWS - 2));
            const x = col * TILE, y = row * TILE;
            if (isNearSpawn(x + 24, y + 16)) continue;
            if (isAllGrass(x, y, 48, 32) && !isBlocked(x, y, 48, 32, fixedObstacles)) {
    extraObjects.push({
    type: 'slope',   // 或 'path_slope'
    x, y, w: 48, h: 32,
    collisionX: x + 20,

    collisionW: 1,

});
fixedObstacles.push({ x: x + 16, y: y + 10, w: 16, h: 12 });
    placed = true;
    break;
}
        }
        if (!placed) console.warn('草坡生成失败');
    }

        if (!placed) console.warn('草路生成失败');
    }

    // ============================================================
    // ---- 4. 聚合体阴影（大块 + 长条，占草地一半） ----
    // ============================================================
    // 辅助：检查单个块（48x16）是否可用（只检查位置，不检查 extraObjects）
    function canPlaceBlockRaw(gx, gy, usedSet) {
        const x = gx * TILE;
        const y = gy * TILE;
        if (gx < 0 || gx + 3 > WORLD_COLS || gy < 0 || gy + 1 > WORLD_ROWS) return false;
        if (!isAllGrass(x, y, 48, 16)) return false;
        if (isBlocked(x, y, 48, 16, fixedObstacles)) return false;
        const key = `${gx},${gy}`;
        if (usedSet && usedSet.has(key)) return false;
        for (const obj of extraObjects) {
            if (obj.type === 'path') {
                if (x < obj.x + obj.w && x + 48 > obj.x &&
                    y < obj.y + obj.h && y + 16 > obj.y) {
                    return false;
                }
            }
        }
        return true;
    }

    // 收集边界点（草地-黄土交界）
    const boundaryPoints = [];
    for (let row = 0; row < WORLD_ROWS; row++) {
        for (let col = 0; col < WORLD_COLS; col++) {
            const cx = col * TILE + 8, cy = row * TILE + 8;
            if (!isGrass(cx, cy)) continue;
            let hasPath = false;
            const neighbors = [[col-1,row],[col+1,row],[col,row-1],[col,row+1]];
            for (const [nc, nr] of neighbors) {
                if (nc < 0 || nc >= WORLD_COLS || nr < 0 || nr >= WORLD_ROWS) continue;
                const nx = nc * TILE + 8, ny = nr * TILE + 8;
                if (!isGrass(nx, ny)) { hasPath = true; break; }
            }
            if (hasPath) boundaryPoints.push({ gx: col, gy: row });
        }
    }
    // 打乱
    for (let i = boundaryPoints.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [boundaryPoints[i], boundaryPoints[j]] = [boundaryPoints[j], boundaryPoints[i]];
    }

    // 总目标块数
    const totalGrassTiles = WORLD_COLS * WORLD_ROWS * 0.5;
    const targetBlockCount = Math.floor(totalGrassTiles / 3);
    let totalPlaced = 0;
    let usedBoundaryIndex = 0;
    const clusterCount = 18 + Math.floor(Math.random() * 11);

    function growCluster(startGx, startGy, targetSize) {
        const placedSet = new Set();
        const blocks = [];
        const queue = [{ gx: startGx, gy: startGy }];
        if (!canPlaceBlockRaw(startGx, startGy, placedSet)) return blocks;
        placedSet.add(`${startGx},${startGy}`);
        blocks.push({ gx: startGx, gy: startGy, x: startGx * TILE, y: startGy * TILE });
        let placed = 1;
        while (placed < targetSize && queue.length > 0) {
            const idx = Math.floor(Math.random() * queue.length);
            const seed = queue[idx];
            const dirs = [[0, -1], [0, 1], [-3, 0], [3, 0]];
            const shuffled = dirs.sort(() => Math.random() - 0.5);
            let placedInThisSeed = false;
            for (const [dx, dy] of shuffled) {
                const ngx = seed.gx + dx;
                const ngy = seed.gy + dy;
                const key = `${ngx},${ngy}`;
                if (!placedSet.has(key) && canPlaceBlockRaw(ngx, ngy, placedSet)) {
                    placedSet.add(key);
                    blocks.push({ gx: ngx, gy: ngy, x: ngx * TILE, y: ngy * TILE });
                    queue.push({ gx: ngx, gy: ngy });
                    placed++;
                    placedInThisSeed = true;
                    break;
                }
            }
            if (!placedInThisSeed) {
                queue.splice(idx, 1);
            }
        }
        return blocks;
    }

    // 生成聚合体并修剪
    for (let i = 0; i < clusterCount && totalPlaced < targetBlockCount; i++) {
        let startGx, startGy;
        let found = false;
        while (usedBoundaryIndex < boundaryPoints.length && !found) {
            const pt = boundaryPoints[usedBoundaryIndex];
            usedBoundaryIndex++;
            if (canPlaceBlockRaw(pt.gx, pt.gy, null)) {
                startGx = pt.gx;
                startGy = pt.gy;
                found = true;
            }
        }
        if (!found) {
            let attempts = 0;
            while (!found && attempts < 100) {
                attempts++;
                const gx = 1 + Math.floor(Math.random() * (WORLD_COLS - 4));
                const gy = 1 + Math.floor(Math.random() * (WORLD_ROWS - 2));
                if (canPlaceBlockRaw(gx, gy, null)) {
                    startGx = gx; startGy = gy; found = true;
                }
            }
        }
        if (!found) continue;

        const size = 8 + Math.floor(Math.random() * 18);
        let blocks = growCluster(startGx, startGy, size);
        if (blocks.length < 3) continue;

        // 修剪
        const deleteRatio = 0.2 + Math.random() * 0.1;
        const deleteCount = Math.floor(blocks.length * deleteRatio);
        if (deleteCount > 0 && blocks.length - deleteCount >= 3) {
            const shuffled = blocks.slice().sort(() => Math.random() - 0.5);
            const toDelete = shuffled.slice(0, deleteCount);
            const deleteSet = new Set(toDelete.map(b => `${b.gx},${b.gy}`));
            blocks = blocks.filter(b => !deleteSet.has(`${b.gx},${b.gy}`));
        }

        for (const b of blocks) {
            extraObjects.push({ type: 'path', x: b.x, y: b.y, w: 48, h: 16 });
            fixedObstacles.push({ x: b.x, y: b.y, w: 48, h: 16 });
        }
        totalPlaced += blocks.length;
    }

    // ============================================================
    // ---- 5. 树、坑、堆、建筑附近零碎阴影（避开坑和坡） ----
    // ============================================================
    try {
        const interestPoints = [];
        for (const t of trees) interestPoints.push({ x: t.x, y: t.y });
        for (const b of BUILDINGS) interestPoints.push({ x: b.x + b.w/2, y: b.y + b.h/2 });
        for (const obj of extraObjects) {
            if (obj.type === 'hollow') interestPoints.push({ x: obj.x + 48, y: obj.y + 48 });
            if (obj.type === 'slope') interestPoints.push({ x: obj.x + 24, y: obj.y + 16 });
        }

        const forbiddenRects = [];
        for (const obj of extraObjects) {
            if (obj.type === 'hollow') forbiddenRects.push({ x: obj.x, y: obj.y, w: 96, h: 96 });
            if (obj.type === 'slope') forbiddenRects.push({ x: obj.x, y: obj.y, w: 48, h: 32 });
        }

        function isOverlappingForbidden(rect) {
            for (const f of forbiddenRects) {
                if (rect.x < f.x + f.w && rect.x + rect.w > f.x &&
                    rect.y < f.y + f.h && rect.y + rect.h > f.y) {
                    return true;
                }
            }
            return false;
        }

        let added = 0;
        for (const pt of interestPoints) {
            if (added > 60) break;
            const num = 1 + Math.floor(Math.random() * 2);
            for (let i = 0; i < num; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const dist = 2 + Math.random() * 4;
                const dx = Math.round(Math.cos(angle) * dist);
                const dy = Math.round(Math.sin(angle) * dist);
                const gx = Math.floor((pt.x + dx * 16) / 16);
                const gy = Math.floor((pt.y + dy * 16) / 16);
                if (gx < 1 || gx + 3 >= WORLD_COLS || gy < 1 || gy + 1 >= WORLD_ROWS) continue;
                const cx = gx * 16 + 8;
                const cy = gy * 16 + 8;
                if (!isGrass(cx, cy)) continue;

                const blockRect = { x: gx * 16, y: gy * 16, w: 48, h: 16 };
                if (isOverlappingForbidden(blockRect)) continue;
                // 检查是否与固定障碍重叠
                if (isBlocked(blockRect.x, blockRect.y, blockRect.w, blockRect.h, fixedObstacles)) continue;

                extraObjects.push({ type: 'path', x: blockRect.x, y: blockRect.y, w: 48, h: 16 });
                added++;

                if (Math.random() < 0.3) {
                    const dir = Math.random() > 0.5 ? 1 : -1;
                    const ngx = gx + dir * 3;
                    const ngy = gy + (Math.random() > 0.5 ? 1 : -1);
                    if (ngx >= 1 && ngx + 3 < WORLD_COLS && ngy >= 1 && ngy + 1 < WORLD_ROWS) {
                        const ncx = ngx * 16 + 8;
                        const ncy = ngy * 16 + 8;
                        if (isGrass(ncx, ncy)) {
                            const neighborRect = { x: ngx * 16, y: ngy * 16, w: 48, h: 16 };
                            if (!isOverlappingForbidden(neighborRect) &&
                                !isBlocked(neighborRect.x, neighborRect.y, neighborRect.w, neighborRect.h, fixedObstacles)) {
                                extraObjects.push({ type: 'path', x: neighborRect.x, y: neighborRect.y, w: 48, h: 16 });
                                added++;
                            }
                        }
                    }
                }
            }
        }
        console.log('树坑堆建筑附近零碎阴影添加完成，新增块数:', added);
    } catch (e) {
        console.warn('零碎阴影生成跳过，错误:', e);
    }
    // ============================================================
    // ---- 6. 土地装饰物（使用 Path_Tile.png，只出现在黄土上） ----
    // ============================================================

    // ---- 6a. 草土坑（绿色坑，但使用 Path_Tile.png 的坑区域，只在草地） ----
    const grassHollowCount = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < grassHollowCount; i++) {
        let placed = false;
        for (let attempt = 0; attempt < 50; attempt++) {
            const col = Math.floor(Math.random() * (WORLD_COLS - 6));
            const row = Math.floor(Math.random() * (WORLD_ROWS - 6));
            const x = col * TILE, y = row * TILE;
             // 避让出生点
            if (isNearSpawn(x + 48, y + 48)) continue;
            if (isAllGrass(x, y, 96, 96) && !isBlocked(x, y, 96, 96, fixedObstacles)) {
                extraObjects.push({
    type: 'grass_hollow',
    x, y, w: 96, h: 96,
    collisionX: x + 32, collisionY: y + 32, collisionW: 32, collisionH: 32
});
fixedObstacles.push({ x: x + 32, y: y + 32, w: 32, h: 32 });
                placed = true;
                break;
            }
        }
        if (!placed) console.warn('草土坑生成失败');
    }

     // ---- 土草坡（黄土上的坡，只在黄土） ----
    const pathSlopeCount = 5 + Math.floor(Math.random() * 4); // 5~8个
    for (let i = 0; i < pathSlopeCount; i++) {
        let placed = false;
        for (let attempt = 0; attempt < 50; attempt++) {
            const col = Math.floor(Math.random() * (WORLD_COLS - 3));
            const row = Math.floor(Math.random() * (WORLD_ROWS - 2));
            const x = col * TILE, y = row * TILE;
            // 检测中心点是否为黄土（!isGrass）
            const cx = x + 24, cy = y + 16;
                        // 避让出生点（中心点）
            if (isNearSpawn(cx, cy)) continue;
            if (!isGrass(cx, cy) && !isBlocked(x, y, 48, 32, fixedObstacles)) {
                extraObjects.push({
                    type: 'path_slope',
                     x, y, w: 48, h: 32,
    collisionX: x + 20,
    collisionY: y + 20,
    collisionW: 1,
    collisionH: 1
});
fixedObstacles.push({ x: x + 16, y: y + 10, w: 16, h: 12 });
                placed = true;
                break;
            }
        }
        if (!placed) console.warn('土草坡生成失败');
    }

    // ---- 6c. 土阴影（黄土上的长条阴影，使用 Path_Tile.png 的路径区域，只在黄土） ----
    const pathShadowCount = 8 + Math.floor(Math.random() * 6);
    for (let i = 0; i < pathShadowCount; i++) {
        let placed = false;
        for (let attempt = 0; attempt < 50; attempt++) {
            const col = Math.floor(Math.random() * (WORLD_COLS - 3));
            const row = Math.floor(Math.random() * (WORLD_ROWS - 1));
            const x = col * TILE, y = row * TILE;
            if (!isAllGrass(x, y, 48, 16) && !isBlocked(x, y, 48, 16, fixedObstacles)) {
                extraObjects.push({ type: 'path_shadow', x, y, w: 48, h: 16 });
                // 不加入障碍，无碰撞
                placed = true;
                break;
            }
        }
        if (!placed) console.warn('土阴影生成失败');
    }
    console.log('草路阴影生成完成，总块数:', extraObjects.filter(o => o.type === 'path').length);
}

let monsters = [], MAX_MONSTERS = 5;
function spawnMonster() {
    if (monsters.length >= MAX_MONSTERS) return;
    const side = Math.floor(Math.random()*4), margin=80;
    let x, y;
    if (side===0) { x = margin + Math.random()*(WORLD_W-2*margin); y = margin; }
    else if (side===1) { x = WORLD_W - margin; y = margin + Math.random()*(WORLD_H-2*margin); }
    else if (side===2) { x = margin + Math.random()*(WORLD_W-2*margin); y = WORLD_H - margin; }
    else { x = margin; y = margin + Math.random()*(WORLD_H-2*margin); }
    monsters.push({
    x, y, w:32, h:32,
    speed: 0.3 + Math.random()*0.3,
    state: 'idle', facingDir: 'down',
    frameIndex: 0, frameTimer: 0, frameDelay: 10,
    hp: 1, alive: true,
    attackCooldown: 0,
    isAttacking: false,   // 新增
    attackTimer: 0        // 新增
});
}

function switchPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function startTransition(cb) {
    const c = document.getElementById('transitionCanvas'), ctx = c.getContext('2d');
    c.width = c.parentElement.clientWidth; c.height = c.parentElement.clientHeight;
    let f=0, maxF=90;
    function draw() {
        if (f>=maxF) { if (cb) cb(); return; }
        f++;
        ctx.fillStyle='#030507'; ctx.fillRect(0,0,c.width,c.height);
        for (let i=0; i<20; i++) {
            const x = Math.random()*c.width, y = Math.random()*c.height;
            ctx.fillStyle = Math.random()>0.7 ? '#4af' : '#0f2a4a';
            ctx.globalAlpha = 0.1 + Math.random()*0.4;
            ctx.fillRect(x, y, 20+Math.random()*100, 2+Math.random()*10);
        }
        ctx.globalAlpha=0.15; ctx.fillStyle='#8cf'; ctx.fillRect(0, (f/maxF)*c.height-2, c.width, 4); ctx.globalAlpha=1;
        const texts = ['⟳ 连接时间线 ...','⟳ 同步观测终端 ...','⟳ 载入纪元数据 ...','⟳ 校准视界 ...'];
        document.getElementById('loadingText').innerText = texts[f % texts.length];
        requestAnimationFrame(draw);
    }
    draw();
}

// ============================================================
// 全局 keydown 监听器（包含所有按键处理）
// ============================================================
document.addEventListener('keydown', function(e) {
    // ESC
    if (e.key === 'Escape') {
            
        e.preventDefault();
        if (document.getElementById('achievementOverlay').style.display === 'flex') return;
        if (document.getElementById('chronicleOverlay').style.display === 'block') { closeChronicle(); return; }
        if (document.getElementById('payDialogOverlay').style.display === 'block') { closePayDialog(); return; }
        if (document.getElementById('dialogOverlay').style.display === 'block') { closeDialog(); return; }
        if (STATE.tradeOpen) { closeTrade(); return; }
        if (document.getElementById('gamePage').classList.contains('active')) toggleHUD();
        return;
    }

    // 铁匠铺对话框
    const dialog = document.getElementById('dialogOverlay');
    if (dialog.style.display === 'block') {
        const yesBtn = document.getElementById('dialogYes');
        const noBtn = document.getElementById('dialogNo');

        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
            e.preventDefault();
            if (yesBtn.style.display !== 'none') yesBtn.focus();
            else if (noBtn.style.display !== 'none') noBtn.focus();
        }
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
            e.preventDefault();
            if (noBtn.style.display !== 'none') noBtn.focus();
            else if (yesBtn.style.display !== 'none') yesBtn.focus();
        }

        if (e.key === 'Enter' || e.key === ' ' || e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            const active = document.activeElement;
            if (active && (active.id === 'dialogYes' || active.id === 'dialogNo')) {
                active.click();
            } else {
                if (yesBtn.style.display !== 'none') yesBtn.click();
                else if (noBtn.style.display !== 'none') noBtn.click();
            }
            return;
        }
    }

    // F 键（建筑/篝火交互）
if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    if (STATE.gamePaused) return;   // 防止在对话框、编年史等打开时误触
    // ---- 副本内出口检测 ----
    if (inDungeon) {
        const dx = STATE.pos.x - DUNGEON.exitX;
        const dy = STATE.pos.y - DUNGEON.exitY;
        if (Math.sqrt(dx*dx + dy*dy) < 50) {
            exitDungeon();
        } else {
            showFloatMessage('走到出口传送阵处按 F 离开', 'system');
        }
        return; // 副本内不执行其他交互
    }
// ---- 仓库交互 ----
if (STATE.nearBuilding && STATE.nearBuilding.type === 'warehouse') {
    if (STATE.job === '启示者' && chronicleRecords.length > 0) {
        enterDungeon();  // 这里必须是 enterDungeon()
    } else {
        showFloatMessage('❌ 需要完成至少一次事件并转职为「启示者」', 'fail');
    }
    return;
}

    // 优先检测篝火
    if (STATE.nearCampfire) {
        openCampfireDialog();
        return;
    }

    // 其次检测建筑
    if (STATE.nearBuilding) {
        if (STATE.nearBuilding.type === 'blacksmith') {
            openDialog();
        } else {
            showFloatMessage('你来到了 ' + STATE.nearBuilding.label, 'system');
        }
        return;
    }
}

    // Shift 跑步
    if (e.key === 'Shift') { STATE.keys.shift = true; return; }

    // 空格攻击
if (e.key === ' ') {
    if (dialog.style.display !== 'block') {
        e.preventDefault();
        if (!STATE.isAttacking && !STATE.isKnockdown) {
            // ---- 根据当前移动方向设置攻击方向 ----
            let dx = 0, dy = 0;
            if (STATE.keys.d) dx = 1;
            if (STATE.keys.a) dx = -1;
            if (STATE.keys.s) dy = 1;
            if (STATE.keys.w) dy = -1;
            // 如果有移动方向，更新 facingDir
            if (dx !== 0 || dy !== 0) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    STATE.facingDir = dx > 0 ? 'right' : 'left';
                } else {
                    STATE.facingDir = dy > 0 ? 'down' : 'up';
                }
            }
            // 如果静止不动，保持当前 facingDir（不修改）
            STATE.isAttacking = true;
            STATE.attackTimer = 0;
            showFloatMessage('⚔️ 攻击！', 'system');
            attackMonsters();
        }
    }
    return;
}

   

    // ===== 核心修复：处理 WASD 移动 =====
    const key = e.key.toLowerCase();
    if (key === 'w' || key === 'arrowup') STATE.keys.w = true;
    if (key === 's' || key === 'arrowdown') STATE.keys.s = true;
    if (key === 'a' || key === 'arrowleft') STATE.keys.a = true;
    if (key === 'd' || key === 'arrowright') STATE.keys.d = true;
});

document.addEventListener('keyup', function(e) {
    const key = e.key.toLowerCase();
    if (key === 'shift') STATE.keys.shift = false;
    if (key === ' ') STATE.keys.space = false;
    if (key === 'w' || key === 'arrowup') STATE.keys.w = false;
    if (key === 's' || key === 'arrowdown') STATE.keys.s = false;
    if (key === 'a' || key === 'arrowleft') STATE.keys.a = false;
    if (key === 'd' || key === 'arrowright') STATE.keys.d = false;
});

let floatTimeout = null;
function showFloatMessage(text, type) {
    const el = document.getElementById('floatMessage');
    if (floatTimeout) { clearTimeout(floatTimeout); el.classList.remove('show'); }
    el.className = type || 'system';
    el.textContent = text;
    void el.offsetHeight;
    el.classList.add('show');
    floatTimeout = setTimeout(() => { el.classList.remove('show'); floatTimeout = null; }, 3500);
}
// 正态分布随机数 (Box-Muller)
function normalRandom(mean = 0, sigma = 1) {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    return mean + sigma * z;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}
// 核心游戏逻辑
function generateNewCharacter() {

    const stats = {};
    for (const key of ['筋骨', '智谋', '体魄']) {
        let raw = normalRandom(mean, sigma);
        // 四舍五入取整，并裁剪到 [10, 110] 避免极端值
        let val = Math.round(raw);
        val = clamp(val, 10, 110);

function performCheck(event, player) {
    const statValue = player.stats[event.primaryStat] || 0;
    if (statValue < event.threshold) {
        return { success: false, reason: '属性不足', msg: `需要${event.primaryStat}≥${event.threshold}` };
    }
    let perkReduction = 0;
    if (player.trait && !player.traitLocked && event.traitMatch.some(t => t === player.trait.name)) {
        perkReduction = player.trait.bonus;
    }
    let finalDiff = event.baseDiff * (1 - perkReduction);
    finalDiff = Math.max(finalDiff, 20);
    const roll = Math.floor(Math.random() * 100) + 1;
   const statBonus = (statValue - event.threshold) * 0.5;  // 每高于门槛1点，+0.5加成
const isSuccess = (roll + statBonus) >= finalDiff;
    return { success: isSuccess, roll: roll, finalDiff: finalDiff, msg: isSuccess ? '天命所归！' : '差之毫厘。' };
}

function handleEvent(eventId) {
    const ev = EVENT_POOL.find(e => e.id === eventId);
    if (!ev) return;
    if (STATE.triggerCooldown[eventId]) return;
    STATE.triggerCooldown[eventId] = true;
    setTimeout(() => { STATE.triggerCooldown[eventId] = false; }, 1500);

    const result = performCheck(ev, STATE.player);
    if (result.reason === '属性不足') {
        showFloatMessage(`尝试【${ev.title}】失败。${result.msg}`, 'fail');
        return;
    }
    if (result.success) {
        addChronicleRecord(ev, result);
        playAchievement(); // 播放视频和音效
        showFloatMessage(`✅ 完成【${ev.title}】！ (掷骰:${result.roll})`, 'success');
        if (ev.baseDiff >= 200) {
            showFloatMessage(`🏛️ 史册更新：你完成了「${ev.title}」，ID载入Chronicle。`, 'milestone');
        }
    } else {
        showFloatMessage(`❌ 【${ev.title}】检定失败 (掷骰:${result.roll})，${result.msg}`, 'fail');
    }
}

// 成就系统（视频 + 音效）
let achievementVideo = document.getElementById('achievementVideo');
let achievementSound = document.getElementById('achievementSound');
let achievementOverlay = document.getElementById('achievementOverlay');
let isAchievementPlaying = false;

function playAchievement(videoSrc = 'assets/video/1.mp4', onComplete = null, showOverlay = true, overlayTitle = '✦ 完成事件 ✦', overlayDesc = '已将您的丰功伟绩同步到Project：Chronicle') {
    if (isAchievementPlaying) return;
    isAchievementPlaying = true;
    STATE.gamePaused = true;

    const video = achievementVideo;
    const sound = achievementSound;
    const overlay = achievementOverlay;

    video.src = videoSrc;
    video.load();

    let triggered = false;
    let timeoutId = null;
    let checkInterval = null;

    function trigger() {
        if (triggered) return;
        triggered = true;
        if (timeoutId) clearTimeout(timeoutId);
        if (checkInterval) clearInterval(checkInterval);

        // 暂停视频（保留最后一帧，不隐藏）
        video.pause();
        video.muted = true;

        setTimeout(() => {
            // 播放音效
            sound.currentTime = 0;
            sound.play().catch(e => console.warn('音效播放失败:', e));

            // 显示成就弹窗（自定义标题和描述）
            if (showOverlay) {
                // 更新弹窗内容
                document.querySelector('#achievementOverlay .title').textContent = overlayTitle;
                document.querySelector('#achievementOverlay .desc').textContent = overlayDesc;
                overlay.style.display = 'flex';
            } else {
                // 如果不显示弹窗，直接恢复游戏并执行回调
                STATE.gamePaused = false;
                isAchievementPlaying = false;
                if (typeof onComplete === 'function') {
                    onComplete();
                }
            }
        }, 100);

        video.onended = null;
        video.onerror = null;
        video.onplaying = null;
        console.log('✅ 成就已触发');
    }

    // 重置视频
    video.currentTime = 0;
    video.style.display = 'block';
    video.muted = false;

    video.onplaying = function() {
        console.log('视频开始播放');
        video.onended = function() {
            console.log('视频 ended 事件触发');
            trigger();
        };
    };

    if (video.readyState >= 3) {
        video.play().catch(err => {
            console.warn('播放失败:', err);
            setTimeout(trigger, 2000);
        });
    } else {
        video.oncanplay = function() {
            video.play().catch(err => {
                console.warn('播放失败:', err);
                setTimeout(trigger, 2000);
            });
        };
    }

    video.onerror = function() {
        console.warn('视频加载错误');
        setTimeout(trigger, 1000);
    };

    timeoutId = setTimeout(function() {
        if (!triggered) {
            console.warn('视频超时，强制触发成就');
            trigger();
        }
    }, 15000);

    checkInterval = setInterval(function() {
        if (triggered) return;
        if (video.duration > 0 && video.currentTime >= video.duration - 0.5) {
            console.log('轮询检测到视频播放完毕');
            trigger();
            clearInterval(checkInterval);
        }
    }, 1000);
}

let canvas, ctx, canvasW=0, canvasH=0, campfire={x:0,y:0,frame:0};

function rectCircleCollide(rx,ry,rw,rh,cx,cy,cr) {
    const nearX = Math.max(rx, Math.min(cx, rx+rw));
    const nearY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - nearX, dy = cy - nearY;
    return dx*dx + dy*dy < cr*cr;
}
function circleCircleCollide(x1,y1,r1,x2,y2,r2) {
    const dx = x1-x2, dy = y1-y2;
    return dx*dx + dy*dy < (r1+r2)*(r1+r2);
}

function tryMove(px, py, dx, dy) {
    const speed = STATE.isRunning ? STATE.speed * 1.7 : STATE.speed;
    const r = 22;

    // ---- 副本内移动 ----
    if (inDungeon) {
        let newX = px + dx * speed;
        let newY = py + dy * speed;
        const margin = 20;
        newX = Math.max(margin, Math.min(DUNGEON.width - margin, newX));
        newY = Math.max(margin, Math.min(DUNGEON.height - margin, newY));
        const pillars = [
            {x: 10, y: 10, w: 24, h: 24},
            {x: DUNGEON.width - 34, y: 10, w: 24, h: 24},
            {x: 10, y: DUNGEON.height - 34, w: 24, h: 24},
            {x: DUNGEON.width - 34, y: DUNGEON.height - 34, w: 24, h: 24}
        ];
        for (const p of pillars) {
            if (rectCircleCollide(p.x, p.y, p.w, p.h, newX, newY, r)) {
                return { x: px, y: py };
            }
        }
        return { x: newX, y: newY };
    }

    // ---- 主世界移动 ----
    let finalX = px, finalY = py;

    // 水平移动
    let testX = px + dx * speed;
    testX = Math.max(r, Math.min(WORLD_W - r, testX));
    let collide = false;

    // 建筑碰撞
    for (const b of BUILDINGS) {
        if (rectCircleCollide(b.x, b.y, b.w, b.h, testX, py, r)) {
            collide = true;
            break;
        }
    }

    // 树木碰撞
    if (!collide) {
        for (const t of trees) {
            if (circleCircleCollide(testX, py, r, t.x, t.y, t.r)) {
                collide = true;
                break;
            }
        }
    }

    
    // ---- 坑和坡碰撞（水平移动） ----
    if (!collide) {
        for (const obj of extraObjects) {
    if (obj.collisionX === undefined) continue;
    if (rectCircleCollide(obj.collisionX, obj.collisionY, obj.collisionW, obj.collisionH, testX, py, r)) {
        collide = true;
        break;
    }
}
    }
    if (!collide) finalX = testX;

    // 垂直移动
    let testY = py + dy * speed;
    testY = Math.max(r, Math.min(WORLD_H - r, testY));
    collide = false;

    // 建筑碰撞
    for (const b of BUILDINGS) {
        if (rectCircleCollide(b.x, b.y, b.w, b.h, finalX, testY, r)) {
            collide = true;
            break;
        }
    }

    // 树木碰撞
    if (!collide) {
        for (const t of trees) {
            if (circleCircleCollide(finalX, testY, r, t.x, t.y, t.r)) {
                collide = true;
                break;
            }
        }
    }

    
    // ---- 坑和坡碰撞（垂直移动） ----
    if (!collide) {
        for (const obj of extraObjects) {
    if (obj.collisionX === undefined) continue;
    if (rectCircleCollide(obj.collisionX, obj.collisionY, obj.collisionW, obj.collisionH, finalX, testY, r)) {
        collide = true;
        break;
    }
}
    }
    if (!collide) finalY = testY;

    return { x: finalX, y: finalY };
}

     if (STATE.isKnockdown) return; // 防止重复触发

function updateCamera() {
    camera.x = STATE.pos.x - canvasW/2;
    camera.y = STATE.pos.y - canvasH/2;
    camera.x = Math.max(0, Math.min(WORLD_W - canvasW, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - canvasH, camera.y));
    if (WORLD_W < canvasW) camera.x = (WORLD_W - canvasW)/2;
    if (WORLD_H < canvasH) camera.y = (WORLD_H - canvasH)/2;
}
function worldToScreen(wx, wy) { return { x: wx - camera.x, y: wy - camera.y }; }

function drawScene() {
    // ---- 如果正在副本中，只绘制房间 ----
    if (inDungeon) {
        drawDungeon();
        return;
    }
    // ... 原有的主世界绘制代码继续 ...
    if (!ctx) return;
    const W = canvasW, H = canvasH;
    updateCamera();
    ctx.save();

        // ---- 草地与黄土斑块 ----
    const tileSize = 16;
    const startCol = Math.floor(camera.x / tileSize);
    const startRow = Math.floor(camera.y / tileSize);
    const endCol = Math.ceil((camera.x + canvasW) / tileSize) + 1;
    const endRow = Math.ceil((camera.y + canvasH) / tileSize) + 1;

    const grassLoaded = IMG.grass && IMG.grass.complete && IMG.grass.naturalWidth > 0;
    const pathLoaded = IMG.path && IMG.path.complete && IMG.path.naturalWidth > 0;

    if (!grassLoaded) {
        ctx.fillStyle = '#3d7a4a';
        ctx.fillRect(0, 0, canvasW, canvasH);
        return;
    }

    // 黄土阈值，调整此值控制黄土面积（约 0.25~0.35 之间）
    const PATH_THRESHOLD = 0.5;

    for (let row = startRow; row < endRow; row++) {
        for (let col = startCol; col < endCol; col++) {
            const px = col * tileSize - camera.x;
            const py = row * tileSize - camera.y;
            if (px + tileSize < 0 || px > canvasW || py + tileSize < 0 || py > canvasH) continue;

            // ---- 使用多层正弦波生成不规则连续区域 ----
            const v1 = Math.sin(row * 0.04 + col * 0.035) * Math.cos(row * 0.03 - col * 0.04);
            const v2 = Math.sin(row * 0.09 + col * 0.08) * Math.cos(row * 0.07 - col * 0.06);
            const v3 = Math.sin(row * 0.15 + col * 0.12) * Math.cos(row * 0.13 - col * 0.14);
            let val = v1 * 1.0 + v2 * 0.6 + v3 * 0.3;
            val += 0.2 * Math.sin(row * 0.011 + col * 0.023);
            val += 0.2 * Math.cos(row * 0.019 - col * 0.017);

            const isPath = val > PATH_THRESHOLD;

            if (isPath && pathLoaded) {
                ctx.drawImage(IMG.path, px, py, tileSize, tileSize);
            } else {
                ctx.drawImage(IMG.grass, px, py, tileSize, tileSize);
            }
        }
    }
          // ---- 绘制额外地形（草坑、草坡、草路 + 土地装饰物） ----
    const cliffLoaded = IMG.cliff && IMG.cliff.complete && IMG.cliff.naturalWidth > 0;
    const pathTileLoaded = IMG.path_tile && IMG.path_tile.complete && IMG.path_tile.naturalWidth > 0;

    if (cliffLoaded || pathTileLoaded) {
        for (const obj of extraObjects) {
            const sp = worldToScreen(obj.x, obj.y);
            if (sp.x + obj.w < 0 || sp.x > canvasW || sp.y + obj.h < 0 || sp.y > canvasH) continue;

            let img = null;
            let src = null;

            // 根据类型选择图片和裁剪源
            if (obj.type === 'hollow' || obj.type === 'slope' || obj.type === 'path') {
                // 原有草版（Cliff_Tile.png）
                if (cliffLoaded) {
                    img = IMG.cliff;
                    if (obj.type === 'hollow') src = CLIFF_SPRITES.hollow;
                    else if (obj.type === 'slope') src = CLIFF_SPRITES.slope;
                    else if (obj.type === 'path') src = CLIFF_SPRITES.path;
                    
                }
            } else if (obj.type === 'grass_hollow') {
    if (pathTileLoaded) {
        img = IMG.path_tile;
        src = PATH_SPRITES.hollow;
    }
}
            else if (obj.type === 'path_slope') {
                // 土草坡（使用 Path_Tile.png 的坡）
                if (pathTileLoaded) {
                    img = IMG.path_tile;
                    src = PATH_SPRITES.slope;
                }
            } else if (obj.type === 'path_shadow') {
                // 土阴影（使用 Path_Tile.png 的路径）
                if (pathTileLoaded) {
                    img = IMG.path_tile;
                    src = PATH_SPRITES.path;
                }
            }

            if (img && src) {
                ctx.drawImage(img, src.sx, src.sy, src.sw, src.sh, sp.x, sp.y, obj.w, obj.h);
            } else {
                // 降级：颜色块
                let color = '#aaa';
                if (obj.type === 'hollow' || obj.type === 'grass_hollow') color = '#3a7a3a';
                else if (obj.type === 'slope' || obj.type === 'path_slope') color = '#5a8a5a';
                else if (obj.type === 'path' || obj.type === 'path_shadow') color = '#8a7a5a';
                ctx.fillStyle = color;
                ctx.fillRect(sp.x, sp.y, obj.w, obj.h);
            }
        }
    }
      // ---- 绘制树木（按 Y 排序，下面的在上层） ----
    const sortedTrees = [...trees].sort((a, b) => a.y - b.y);
    for (const t of sortedTrees) {
        const sp = worldToScreen(t.x, t.y);
        if (sp.x < -100 || sp.x > canvasW + 100 || sp.y < -100 || sp.y > canvasH + 100) continue;
        if (IMG.tree && IMG.tree.complete && IMG.tree.naturalWidth > 0) {
            ctx.drawImage(IMG.tree, sp.x - t.w/2, sp.y - t.h/2, t.w, t.h);
        } else {
            ctx.fillStyle = '#2d5a3a';
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, t.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 建筑
    for (let idx=0; idx<BUILDINGS.length; idx++) {
        const b = BUILDINGS[idx];
        const sp = worldToScreen(b.x, b.y);
        if (sp.x < -100 || sp.x > W+100 || sp.y < -100 || sp.y > H+100) continue;
        if (IMG.house && IMG.house.complete && IMG.house.naturalWidth > 0) {
            ctx.drawImage(IMG.house, sp.x, sp.y, b.w, b.h);
        } else {
            ctx.fillStyle = '#6a5a4a';
            ctx.fillRect(sp.x, sp.y, b.w, b.h);
        }
        ctx.fillStyle = 'rgba(220,235,255,.8)';
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,.8)';
        ctx.shadowBlur = 6;
        ctx.fillText(b.label, sp.x + b.w/2, sp.y + b.h + 20);
        ctx.shadowBlur = 0;

        // 交互检测
        const cx = b.x + b.w/2, cy = b.y + b.h/2;
        const dx = STATE.pos.x - cx, dy = STATE.pos.y - cy;
        if (Math.sqrt(dx*dx + dy*dy) < 100) {
            STATE.nearBuilding = b;
            ctx.shadowColor = 'rgba(255,215,0,.3)';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = 'rgba(255,215,0,.5)';
            ctx.lineWidth = 3;
            ctx.strokeRect(sp.x - 4, sp.y - 4, b.w + 8, b.h + 8);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(0,0,0,.6)';
            ctx.fillRect(sp.x + b.w/2 - 65, sp.y - 34, 130, 30);
            ctx.fillStyle = '#ffdd44';
            ctx.shadowColor = 'rgba(0,0,0,.6)';
            ctx.shadowBlur = 8;
            ctx.fillText('按 F 交互', sp.x + b.w/2, sp.y - 14);
            ctx.shadowBlur = 0;
        } else {
            if (STATE.nearBuilding === b) STATE.nearBuilding = null;
        }
    }

    // 篝火
    const fsp = worldToScreen(campfire.x, campfire.y);

function drawDungeon() {
    const W = canvasW, H = canvasH;
    ctx.save();

    // ---- 计算房间居中偏移 ----
    const offsetX = (W - DUNGEON.width) / 2;
    const offsetY = (H - DUNGEON.height) / 2;

    // 1. 背景（填充整个画布）
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, 0, W, H);

    // 2. 地板（网格）加偏移
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1;
    for (let x = 0; x <= DUNGEON.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(offsetX + x, offsetY);
        ctx.lineTo(offsetX + x, offsetY + DUNGEON.height);
        ctx.stroke();
    }
    for (let y = 0; y <= DUNGEON.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(offsetX, offsetY + y);
        ctx.lineTo(offsetX + DUNGEON.width, offsetY + y);
        ctx.stroke();
    }

    // 3. 墙壁（边框）加偏移
    ctx.strokeStyle = '#6a5a4a';
    ctx.lineWidth = 6;
    ctx.strokeRect(offsetX, offsetY, DUNGEON.width, DUNGEON.height);

    // 4. 四角柱子加偏移
    ctx.fillStyle = '#5a4a3a';
    const pillar = 24;
    ctx.fillRect(offsetX + 10, offsetY + 10, pillar, pillar);
    ctx.fillRect(offsetX + DUNGEON.width - 10 - pillar, offsetY + 10, pillar, pillar);
    ctx.fillRect(offsetX + 10, offsetY + DUNGEON.height - 10 - pillar, pillar, pillar);
    ctx.fillRect(offsetX + DUNGEON.width - 10 - pillar, offsetY + DUNGEON.height - 10 - pillar, pillar, pillar);

    // 5. 出口传送阵（右下角）加偏移
    const ex = DUNGEON.exitX, ey = DUNGEON.exitY;
    ctx.fillStyle = 'rgba(0, 200, 255, 0.2)';
    ctx.beginPath();
    ctx.arc(offsetX + ex + 20, offsetY + ey + 20, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 200, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#aaf';
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⬆ 出口', offsetX + ex + 20, offsetY + ey - 10);

    // ---- 检测玩家是否在出口附近 ----
    const dxExit = STATE.pos.x - (ex + 20);
    const dyExit = STATE.pos.y - (ey + 20);
    const distExit = Math.sqrt(dxExit * dxExit + dyExit * dyExit);
    if (distExit < 50) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(offsetX + ex - 10, offsetY + ey + 30, 60, 24);
        ctx.fillStyle = '#aaf';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('按 F 退出', offsetX + ex + 20, offsetY + ey + 48);
    }

    // 6. Boss（加偏移）
    if (dungeonBoss) {

                col = 3;
            }
        } else if (b.isAttacking) {
            const dir = b.facingDir;

        // 血条（仅在 alive 或 dying 时显示）

        const dir = STATE.facingDir;
        if (dir === 'down') row = cfg.rows.attack_down;
        else if (dir === 'right' || dir === 'left') row = cfg.rows.attack_right;
        else if (dir === 'up') row = cfg.rows.attack_up;
        else row = cfg.rows.attack_down;
        STATE.frameTimer++;
        if (STATE.frameTimer >= STATE.frameDelay) {
            STATE.frameTimer = 0;
            STATE.frameIndex = (STATE.frameIndex + 1) % cfg.anim.attack_down.length;
        }
        col = STATE.frameIndex;
    } else {
        const sk = STATE.animState;
        const map = {
            'idle': cfg.rows.walk_down,
            'walk_down': cfg.rows.walk_down,
            'walk_right': cfg.rows.walk_right,
            'walk_left': cfg.rows.walk_right,
            'walk_up': cfg.rows.walk_up,
            'run_down': cfg.rows.run_down,
            'run_right': cfg.rows.run_right,
            'run_left': cfg.rows.run_right,
            'run_up': cfg.rows.run_up
        };
        row = map[sk] || cfg.rows.walk_down;
        let anim = cfg.anim.idle;
        if (sk.startsWith('run')) anim = cfg.anim.run_down;
        else if (sk.startsWith('walk')) anim = cfg.anim.walk_down;
        else anim = cfg.anim.idle;
        STATE.frameTimer++;
        if (STATE.frameTimer >= STATE.frameDelay) {
            STATE.frameTimer = 0;
            STATE.frameIndex = (STATE.frameIndex + 1) % anim.length;
        }
        col = STATE.frameIndex % cfg.cols;

    if (IMG.player && IMG.player.complete && IMG.player.naturalWidth > 0) {

        ctx.translate(offsetX + px, offsetY + py);
        if (STATE.facingDir === 'left') ctx.scale(-1, 1);

        ctx.restore();
    } else {
        ctx.fillStyle = '#6af';
        ctx.fillRect(offsetX + px - 12, offsetY + py - 24, 24, 24);
    }

    ctx.restore();
}
function updateAnimation() {
    // ---- 倒地状态 ----
    if (STATE.isKnockdown) {
    // 初始化动画状态
    if (STATE.animState !== 'knockdown') {
        STATE.animState = 'knockdown';
        STATE.deathFrame = 0;
        STATE.deathTimer = 0;
    }
    // 如果还没播到最后一帧，则推进
    const total = SPRITE.anim.knockdown.length; // 假设是4
    if (STATE.deathFrame < total - 1) {
        STATE.deathTimer++;
        if (STATE.deathTimer >= 8) {   // 每8帧切换一帧
            STATE.deathTimer = 0;
            STATE.deathFrame++;
        }
    }
    // 如果已经播完，保持最后一帧（不做额外操作）
    return;  // 阻止后续移动/攻击逻辑
    if (STATE.isKnockdown) return;
}

    // ---- 攻击状态 ----
    if (STATE.isAttacking) {
        if (STATE.animState !== 'attack') {
            STATE.animState = 'attack';
            STATE.frameIndex = 0;
            STATE.frameTimer = 0;
        }
        STATE.attackTimer++;
        if (STATE.attackTimer > 30) {
            STATE.isAttacking = false;
            STATE.attackTimer = 0;
            STATE.animState = 'idle';
            STATE.frameIndex = 0;
            STATE.frameTimer = 0;
        }
        return;
    }

    // ---- 移动 / 疾跑 ----
    const moving = STATE.moving;
    const running = STATE.keys.shift && moving;
    STATE.isRunning = running;

    if (!moving) {
        if (STATE.animState !== 'idle') {
            STATE.animState = 'idle';
            STATE.frameIndex = 0;
            STATE.frameTimer = 0;
        }
        return;
    }

    // 计算方向
    let dx = (STATE.keys.d ? 1 : 0) - (STATE.keys.a ? 1 : 0);
    let dy = (STATE.keys.s ? 1 : 0) - (STATE.keys.w ? 1 : 0);
    if (STATE.joystick.active) {
        dx = STATE.joystick.dx;
        dy = STATE.joystick.dy;
    }

    let dir = 'down';
    if (dx > 0.1) dir = 'right';
    else if (dx < -0.1) dir = 'left';
    else if (dy < -0.1) dir = 'up';
    else if (dy > 0.1) dir = 'down';

    const newState = running ? `run_${dir}` : `walk_${dir}`;

    if (STATE.animState !== newState) {
        STATE.animState = newState;
        STATE.frameIndex = 0;
        STATE.frameTimer = 0;
    }

    STATE.facingDir = dir;
}

function updatePlayer() {
    if (STATE.isKnockdown) return;
    if (STATE.gamePaused) return;
    if (STATE.isKnockdown) return;
    let dx=0, dy=0;
    if (STATE.keys.w) dy = -1;
    if (STATE.keys.s) dy = 1;
    if (STATE.keys.a) dx = -1;
    if (STATE.keys.d) dx = 1;
    if (STATE.joystick.active) {
        const jd = STATE.joystick;
        const mag = Math.sqrt(jd.dx*jd.dx + jd.dy*jd.dy);
        if (mag > 0.15) { dx += jd.dx/mag; dy += jd.dy/mag; }
    }
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 1) { dx /= len; dy /= len; }
    STATE.moving = (len > 0.05);
    if (STATE.moving) {
        const np = tryMove(STATE.pos.x, STATE.pos.y, dx, dy);
        STATE.pos.x = np.x;
        STATE.pos.y = np.y;
        STATE.facing = dx;
    }

    // 摇杆联动
    if (STATE.keys.w || STATE.keys.s || STATE.keys.a || STATE.keys.d) {
        let jdx=0, jdy=0;
        if (STATE.keys.w) jdy=-1;
        if (STATE.keys.s) jdy=1;
        if (STATE.keys.a) jdx=-1;
        if (STATE.keys.d) jdx=1;
        const jlen = Math.sqrt(jdx*jdx + jdy*jdy);
        if (jlen > 0) {
            jdx /= jlen; jdy /= jlen;
            if (!STATE.joystick.active) {
                const knob = document.getElementById('joystickKnob');
                const maxDist = 60 - 24 + 4;
                knob.style.transform = `translate(${jdx*maxDist - 24}px, ${jdy*maxDist - 24}px)`;
                knob.classList.add('pressed');
                document.getElementById('joystickBase').classList.add('active');
            }
        }
    } else {
        if (!STATE.joystick.active) {
            const knob = document.getElementById('joystickKnob');
            knob.style.transform = 'translate(-24px,-24px)';
            knob.classList.remove('pressed');
            document.getElementById('joystickBase').classList.remove('active');
        }
    }
}

    animationId = requestAnimationFrame(gameLoop);
}

// ============================================================
// 鼠标左键攻击
// ============================================================
function initMouseAttack() {
    // 移除旧监听（避免重复绑定）
    canvas.removeEventListener('click', initMouseAttack._handler);
    // 定义新处理函数
    const handler = function(e) {
        if (STATE.gamePaused) return;

        // 计算画布上的像素坐标
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        // ---- 副本内 ----
        if (inDungeon) {
            if (STATE.isAttacking || STATE.isKnockdown) return;
            STATE.isAttacking = true;
            STATE.attackTimer = 0;
            // 副本内直接使用像素坐标（因为 drawDungeon 从 (0,0) 绘制，无 camera 偏移）
            const dx = mx - STATE.pos.x;
            const dy = my - STATE.pos.y;
            const angle = Math.atan2(dy, dx);
            if (Math.abs(angle) < Math.PI / 4) {
                STATE.facingDir = 'right';
            } else if (Math.abs(angle) > 3 * Math.PI / 4) {
                STATE.facingDir = 'left';
            } else if (angle > 0) {
                STATE.facingDir = 'down';
            } else {
                STATE.facingDir = 'up';
            }
            attackMonsters();
            STATE.attackCooldown = 15;
            return;
        }

        // ---- 主世界 ----
        const wx = mx + camera.x;
        const wy = my + camera.y;
// ---- 检测是否点击了篝火 ----
        const dxFire = wx - campfire.x;
        const dyFire = wy - campfire.y;
        if (Math.sqrt(dxFire * dxFire + dyFire * dyFire) < 50) {
            if (!inDungeon) {
                openCampfireDialog();
                return; // 阻止后续攻击和建筑交互
            }
        }
        // 检测是否点击了建筑
        let buildingClicked = false;
        for (const b of BUILDINGS) {
            if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) {
                buildingClicked = true;
                if (b.type === 'blacksmith') {
                    openDialog();
                } else {
                    showFloatMessage('你来到了 ' + b.label, 'system');
                }
                break;
            }
        }

        if (!buildingClicked) {
            if (STATE.isAttacking || STATE.isKnockdown) return;
            STATE.isAttacking = true;
            STATE.attackTimer = 0;
            const dx = wx - STATE.pos.x;
            const dy = wy - STATE.pos.y;
            const angle = Math.atan2(dy, dx);
            if (Math.abs(angle) < Math.PI / 4) {
                STATE.facingDir = 'right';
            } else if (Math.abs(angle) > 3 * Math.PI / 4) {
                STATE.facingDir = 'left';
            } else if (angle > 0) {
                STATE.facingDir = 'down';
            } else {
                STATE.facingDir = 'up';
            }
            attackMonsters();
            STATE.attackCooldown = 15;
        }
    };
    // 保存引用以便移除
    initMouseAttack._handler = handler;
    canvas.addEventListener('click', handler);
}

// ============================================================
// 初始化
// ============================================================
function initGameCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    // 如果 trees 或 extraObjects 为空，则生成（否则使用已有数据）
    if (trees.length === 0) generateTrees();
    if (extraObjects.length === 0) generateExtraTerrain();
    // 篝火如果未定义则设置默认值
    if (!campfire || campfire.x === undefined) {
        campfire = { x: WORLD_W / 2, y: WORLD_H / 2, frame: 0 };
    }
    STATE.pos.x = STATE.pos.x || WORLD_W * 0.5;
    STATE.pos.y = STATE.pos.y || WORLD_H * 0.55;
    updateCamera();
    initMouseAttack();
}
function resizeCanvas() {
    if (!canvas) return;
    const rect = document.getElementById('gamePage').getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    canvasW = canvas.width;
    canvasH = canvas.height;
}

// ============================================================
// 虚拟摇杆
// ============================================================
const joystickZone = document.getElementById('joystickZone');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const jRadius = 60, knobRadius = 24;

function getJoystickCenter() {
    const rect = joystickBase.getBoundingClientRect();
    return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
}
function handleJoystickMove(cx, cy) {
    const center = getJoystickCenter();
    let dx = cx - center.x, dy = cy - center.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = jRadius - knobRadius + 4;
    if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
    joystickKnob.style.transform = `translate(${dx - knobRadius}px, ${dy - knobRadius}px)`;
    joystickKnob.classList.add('pressed');
    joystickBase.classList.add('active');
    if (dist > 5) {
        STATE.joystick.dx = dx / maxDist;
        STATE.joystick.dy = dy / maxDist;
        STATE.joystick.active = true;
    } else {
        STATE.joystick.dx = 0; STATE.joystick.dy = 0; STATE.joystick.active = false;
    }
}
function resetJoystick() {
    joystickKnob.style.transform = `translate(-${knobRadius}px, -${knobRadius}px)`;
    joystickKnob.classList.remove('pressed');
    joystickBase.classList.remove('active');
    STATE.joystick.dx = 0; STATE.joystick.dy = 0; STATE.joystick.active = false;
}
joystickZone.addEventListener('mousedown', (e) => {
    e.preventDefault();
    handleJoystickMove(e.clientX, e.clientY);
    const onMove = (ev) => handleJoystickMove(ev.clientX, ev.clientY);
    const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        resetJoystick();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
});
joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    handleJoystickMove(touch.clientX, touch.clientY);
    const onMove = (ev) => {
        ev.preventDefault();
        const t = ev.touches[0];
        if (t) handleJoystickMove(t.clientX, t.clientY);
    };
    const onEnd = () => {
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        resetJoystick();
    };
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
}, { passive: false });

// ============================================================
// 启动
// ============================================================
window.addEventListener('resize', () => {
    if (canvas) resizeCanvas();
    const c = document.getElementById('transitionCanvas');
    if (c) { c.width = c.parentElement.clientWidth; c.height = c.parentElement.clientHeight; }
});
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = typeof r === 'number' ? r : (r || 0);
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
    };
}
